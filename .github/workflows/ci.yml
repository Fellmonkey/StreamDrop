name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend — vet + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -trimpath -o bin/streamdrop-linux-amd64 ./cmd/streamdrop

  web:
    name: Web — build + contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Contract tests (vitest)
        run: npm test

  lint:
    name: Lint (golangci-lint v2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v2.15.0
          args: run ./...

  matrix-build:
    name: Cross-compile (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            arch: amd64
          - os: windows
            arch: arm64
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} \
            go build -trimpath -o bin/streamdrop-${{ matrix.os }}-${{ matrix.arch }} ./cmd/streamdrop

      - uses: actions/upload-artifact@v4
        with:
          name: streamdrop-${{ matrix.os }}-${{ matrix.arch }}
          path: bin/streamdrop-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error

  depcheck:
    name: Dependency checksums (windows/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download release archives
        run: |
          mkdir -p staging
          curl -fsSL -o staging/rclone.zip https://downloads.rclone.org/v1.68.2/rclone-v1.68.2-windows-amd64.zip
          curl -fsSL -o staging/curl.zip https://curl.se/windows/dl-8.12.1_8/curl-8.12.1_8-win64-mingw.zip

      - name: Verify checksums
        run: go run ./cmd/depcheck -staging staging -os windows -arch amd64
