name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: vet, tests and frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Build SPA
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

      - name: Verify dependency catalog
        run: go run ./cmd/depcheck -allow-unpinned

  windows-smoke:
    name: windows build (reference platform)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Build SPA
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build streamdrop.exe
        run: |
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o streamdrop.exe ./cmd/streamdrop

      - name: Verify embedded UI and local API
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath .\streamdrop.exe -ArgumentList '--no-tray','--no-browser','--port','18085' -PassThru
          try {
            Start-Sleep -Seconds 5
            $page = Invoke-WebRequest -Uri http://127.0.0.1:18085/ -UseBasicParsing
            if ($page.StatusCode -ne 200) { throw "index status $($page.StatusCode)" }
            if ($page.Content -notmatch 'streamdrop-token') { throw "token meta missing" }
            $token = [regex]::Match($page.Content, 'name="streamdrop-token" content="([^"]+)"').Groups[1].Value
            if (-not $token) { throw "token empty" }
            $status = Invoke-RestMethod -Uri http://127.0.0.1:18085/api/v1/status -Headers @{ 'X-StreamDrop-Token' = $token }
            if ($status.version -ne '1.0.0') { throw "unexpected version $($status.version)" }
            try {
              Invoke-WebRequest -Uri http://127.0.0.1:18085/api/v1/status -UseBasicParsing | Out-Null
              throw "API answered without a token"
            } catch {
              if ($_.Exception.Response.StatusCode.value__ -ne 401) { throw }
            }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@v4
        with:
          name: streamdrop-windows-amd64-smoke
          path: streamdrop.exe
          if-no-files-found: error
