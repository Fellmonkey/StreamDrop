    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#090a0f" />

    <title>StreamDrop</title>
    <script>
      try {
        var t = localStorage.getItem('streamdrop.theme') || 'dark'
        document.documentElement.classList.toggle('dark', t === 'dark')
        var a = localStorage.getItem('streamdrop.accent')
        if (a === 'amber' || a === 'emerald' || a === 'violet') {
          document.documentElement.setAttribute('data-accent', a)
        }
        var s = localStorage.getItem('streamdrop.style')
        if (s === 'contrast' || s === 'soft') {
          document.documentElement.setAttribute('data-style', s)
        }
      } catch (e) {
        document.documentElement.classList.add('dark')
      }
    </script>
